<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS CRM - Complete Payroll Dashboard</title>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 { font-size: 1.6em; margin-bottom: 5px; }
        .header p { font-size: 0.85em; opacity: 0.9; }

        .controls {
            padding: 12px;
            background: #f8f9fa;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 2px solid #e9ecef;
            align-items: flex-end;
        }

        .control { display: flex; flex-direction: column; gap: 3px; min-width: 120px; }
        .control label { font-weight: 600; font-size: 0.75em; color: #333; }
        .control input, .control select {
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 0.75em;
        }

        .btn {
            padding: 5px 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75em;
        }

        .btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3); }

        .message { 
            padding: 8px 12px; 
            background: #d4edda; 
            color: #155724; 
            border-left: 4px solid #28a745; 
            margin: 0; 
            font-size: 0.8em;
        }

        .table-wrapper {
            overflow: auto;
            max-height: calc(100vh - 320px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75em;
        }

        thead {
            background: #e9ecef;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 8px 3px;
            font-weight: 600;
            color: #333;
            border: 1px solid #ddd;
            text-align: center;
            white-space: nowrap;
            font-size: 0.75em;
        }
        
        th.date-col {
            min-width: 40px;
            max-width: 40px;
            padding: 5px 1px;
            font-size: 0.7em;
        }

        th.sticky { 
            position: sticky; 
            z-index: 12; 
            background: #d9dce0;
            min-width: 70px;
            padding: 8px 3px;
        }

        th.sticky:nth-child(1) { left: 0; }
        th.sticky:nth-child(2) { left: 70px; }
        th.sticky:nth-child(3) { left: 140px; }
        th.sticky:nth-child(4) { left: 210px; }

        td {
            padding: 6px 3px;
            border: 1px solid #e9ecef;
            text-align: center;
            color: #555;
            min-height: 35px;
            vertical-align: middle;
        }
        
        td.date-cell {
            min-width: 40px;
            max-width: 40px;
            padding: 5px 1px;
        }
        
        td.summary-cell {
            min-width: 55px;
        }

        td.sticky {
            position: sticky;
            z-index: 11;
            background: white;
            text-align: center;
            font-weight: 500;
            min-width: 70px;
            padding: 6px 3px;
            font-size: 0.8em;
        }

        td.sticky:nth-child(1) { left: 0; }
        td.sticky:nth-child(2) { left: 70px; }
        td.sticky:nth-child(3) { left: 140px; }
        td.sticky:nth-child(4) { left: 210px; }

        tr:hover { background: #f8f9fa; }
        tr:hover td.sticky { background: #e3f2fd; }

        input { 
            width: 95%; 
            padding: 6px 4px; 
            border: 1px solid #ccc; 
            border-radius: 3px;
            font-size: 0.95em; 
            text-align: center;
            min-height: 30px;
        }
        input, select { 
            width: 100%; 
            padding: 4px 2px; 
            border: 1px solid #ccc; 
            border-radius: 2px;
            font-size: 0.8em; 
            text-align: center;
            min-height: 24px;
            box-sizing: border-box;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; background: #f0f8ff; }

        .date-col {
            writing-mode: horizontal-tb !important;
            text-orientation: initial !important;
            height: auto !important;
            padding: 8px 2px !important;
            font-size: 0.75em;
            line-height: 1.2;
        }

        .att-P { background: #c8e6c9; color: #1b5e20; font-weight: 600; cursor: pointer; font-size: 0.9em; padding: 4px; display: flex; align-items: center; justify-content: center; }
        .att-A { background: #ffcdd2; color: #b71c1c; font-weight: 600; cursor: pointer; font-size: 0.9em; padding: 4px; display: flex; align-items: center; justify-content: center; }
        .att-H { background: #b3e5fc; color: #01579b; font-weight: 600; cursor: pointer; font-size: 0.9em; padding: 4px; display: flex; align-items: center; justify-content: center; }
        .att-WO { background: #fff9c4; color: #f57f17; font-weight: 600; cursor: pointer; font-size: 0.9em; padding: 4px; display: flex; align-items: center; justify-content: center; }

        .calc { background: #e1f5fe; color: #01579b; font-weight: 600; font-size: 0.85em; padding: 4px; }

        .stats { 
            padding: 12px; 
            background: #f8f9fa; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); 
            gap: 10px;
        }

        .stat { 
            background: white; 
            padding: 10px; 
            border-radius: 4px; 
            text-align: center; 
            border-left: 3px solid #667eea;
        }
        .stat-label { font-size: 0.7em; color: #666; font-weight: 600; }
        .stat-value { font-size: 1.1em; font-weight: bold; color: #333; margin-top: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Complete Payroll Dashboard | 23 Employees | Auto-Calculated All Fields</h1>
            <p>Dates with Day Names | Auto-detect Sundays as WO | Real-time Salary Calculations</p>
        </div>

        <div class="controls">
            <div class="control">
                <label>📅 Month:</label>
                <select id="monthSelect" onchange="changeMonth()">
                    <option value="2026-04">April 2026</option>
                    <option value="2026-05">May 2026</option>
                    <option value="2026-06">June 2026</option>
                </select>
            </div>
            <div class="control">
                <label>🔍 Search:</label>
                <input type="text" id="searchBox" placeholder="Name..." onkeyup="filterTable()">
            </div>
            <div class="control">
                <label>🏢 Branch:</label>
                <select id="branchFilter" onchange="filterTable()">
                    <option value="">All</option>
                    <option value="EPS LTD">EPS LTD</option>
                    <option value="OFFICE">OFFICE</option>
                    <option value="CASH">CASH</option>
                </select>
            </div>
            <button class="btn" onclick="saveChanges()">💾 Save</button>
            <button class="btn" onclick="exportToExcel()">📊 Export</button>
            <button class="btn" onclick="resetFilters()">🔄 Reset</button>
        </div>

        <div id="messageBox"></div>

        <div class="table-wrapper">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="stats" id="statsBar"></div>
    </div>

    <script>
        let allData = [];
        let currentMonth = '2026-04';
        let changes = {};

        const employees = [
            { sr_no: 1, name: 'Rizwan Patel', branch: 'EPS LTD', gross_salary: 29000, leave_pending: 46, advance: 0, loan: 5000 },
            { sr_no: 2, name: 'Mahendra Thorse', branch: 'EPS LTD', gross_salary: 44000, leave_pending: 131, advance: 0, loan: 0 },
            { sr_no: 3, name: 'Sopan Sable', branch: 'EPS LTD', gross_salary: 29100, leave_pending: 41, advance: 1500, loan: 0 },
            { sr_no: 4, name: 'Sonu Prajapati', branch: 'EPS LTD', gross_salary: 23500, leave_pending: 33, advance: 0, loan: 0 },
            { sr_no: 5, name: 'Sudhir Naik', branch: 'EPS LTD', gross_salary: 41500, leave_pending: 120, advance: 0, loan: 0 },
            { sr_no: 6, name: 'Abhishek Masane', branch: 'OFFICE', gross_salary: 25500, leave_pending: 35, advance: 0, loan: 2000 },
            { sr_no: 7, name: 'Manaswi Bhosle', branch: 'OFFICE', gross_salary: 26500, leave_pending: 38, advance: 0, loan: 0 },
            { sr_no: 8, name: 'Sheetal Parulekar', branch: 'OFFICE', gross_salary: 29800, leave_pending: 43, advance: 500, loan: 0 },
            { sr_no: 9, name: 'Akbar Khan', branch: 'EPS LTD', gross_salary: 20000, leave_pending: 23, advance: 0, loan: 1000 },
            { sr_no: 10, name: 'Jayshree Thorse', branch: 'CASH', gross_salary: 21500, leave_pending: 50, advance: 0, loan: 0 },
            { sr_no: 11, name: 'Joy Mathew', branch: 'OFFICE', gross_salary: 30000, leave_pending: 60, advance: 0, loan: 3000 },
            { sr_no: 12, name: 'Deepikas Satam', branch: 'OFFICE', gross_salary: 36000, leave_pending: 75, advance: 0, loan: 0 },
            { sr_no: 13, name: 'Lavakumar Shetty', branch: 'OFFICE', gross_salary: 36000, leave_pending: 65, advance: 0, loan: 2500 },
            { sr_no: 14, name: 'Vinayak Bhat', branch: 'OFFICE', gross_salary: 36000, leave_pending: 70, advance: 1000, loan: 0 },
            { sr_no: 15, name: 'Pankaj Indulkar', branch: 'OFFICE', gross_salary: 28500, leave_pending: 55, advance: 0, loan: 0 },
            { sr_no: 16, name: 'Prakash Patil', branch: 'EPS LTD', gross_salary: 26700, leave_pending: 40, advance: 0, loan: 1500 },
            { sr_no: 17, name: 'Darshana Nandosar', branch: 'OFFICE', gross_salary: 22000, leave_pending: 35, advance: 0, loan: 0 },
            { sr_no: 18, name: 'Jayprakash Yadav', branch: 'EPS LTD', gross_salary: 21700, leave_pending: 38, advance: 500, loan: 0 },
            { sr_no: 19, name: 'Ashok Khade', branch: 'EPS LTD', gross_salary: 21200, leave_pending: 30, advance: 0, loan: 1000 },
            { sr_no: 20, name: 'Saeed', branch: 'EPS LTD', gross_salary: 21000, leave_pending: 33, advance: 0, loan: 0 },
            { sr_no: 21, name: 'Anil Kasbekar', branch: 'EPS LTD', gross_salary: 19600, leave_pending: 28, advance: 0, loan: 500 },
            { sr_no: 22, name: 'Praful Jogale', branch: 'EPS LTD', gross_salary: 26500, leave_pending: 48, advance: 0, loan: 2000 },
            { sr_no: 23, name: 'Anjan Sahu', branch: 'OFFICE', gross_salary: 30000, leave_pending: 60, advance: 0, loan: 0 }
        ];

        window.addEventListener('load', () => { checkAuth(); });

        function checkAuth() {
            const userEmail = localStorage.getItem('eps_crm_user_email');
            if (userEmail === 'accounts@epsworldwide.in') {
                loadData();
            } else {
                window.location.href = 'eps-crm-dashboard.html';
            }
        }

        function getDaysInMonth(month) {
            const [year, monthNum] = month.split('-');
            return new Date(year, parseInt(monthNum), 0).getDate();
        }

        function getDayName(date) {
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            return days[date.getDay()];
        }

        function calculateAllFields(emp, totalDays) {
            // Count attended days and Sundays
            let presentDays = 0, weeklyOff = 0;
            const attendance = emp.attendance || {};
            
            for (let d = 1; d <= totalDays; d++) {
                const date = new Date(currentMonth + `-${String(d).padStart(2, '0')}`);
                const dayNum = date.getDay();
                
                if (dayNum === 0) {
                    weeklyOff++;
                } else {
                    const status = (attendance[d] || 'P').toUpperCase();
                    if (status === 'P') presentDays++;
                }
            }
            
            emp.present_days = presentDays;
            emp.weekly_off = weeklyOff;
            emp.total_days = totalDays;
            emp.month_days = totalDays;
            
            // Auto-calculate absent = total - present - weekly off - holidays
            const holidays = parseInt(emp.holidays) || 0;
            const absent = totalDays - presentDays - weeklyOff - holidays;
            emp.absent = Math.max(0, absent);
            
            // Half days
            emp.halfday = parseInt(emp.halfday) || 0;
            emp.total_halfday = emp.halfday;
            
            // Actual present/absent
            emp.actual_present = presentDays;
            emp.actual_absent = emp.absent;
            
            // Per day calculation
            emp.per_day_calc = (emp.gross_salary / totalDays).toFixed(2);
            
            // Paid days = present + (halfday/2) - OT that's separate
            const otDays = parseInt(emp.ot_days) || 0;
            emp.paid_days = presentDays + (emp.halfday / 2);
            emp.deduction_days = totalDays - emp.paid_days;
            
            // Salary calculations
            const monthlySalary = Math.round((emp.gross_salary / totalDays) * emp.paid_days);
            const otSalary = otDays > 0 ? Math.round((emp.gross_salary / totalDays) * otDays * 2) : 0;
            const totalEarned = monthlySalary + otSalary;
            
            emp.monthly_salary = monthlySalary;
            emp.ot_salary = otSalary;
            emp.total_earned = totalEarned;
            
            // Deductions (fixed components)
            const pf = Math.round((monthlySalary * 6.17) / 100);
            const esic = Math.round((monthlySalary * 0.75) / 100);
            const pTax = 200;
            const incomeTax = monthlySalary > 50000 ? Math.round((monthlySalary * 5) / 100) : 0;
            
            emp.pf = pf;
            emp.esic = esic;
            emp.p_tax = pTax;
            emp.income_tax = incomeTax;
            
            // Variable deductions
            emp.advance = parseInt(emp.advance) || 0;
            emp.loan = parseInt(emp.loan) || 0;
            
            emp.total_deduction = pf + esic + pTax + incomeTax + emp.advance + emp.loan;
            emp.net_salary = totalEarned - emp.total_deduction;
            
            // Leaves
            emp.adding_leaves = 2;
            emp.leave_available = emp.leave_pending + emp.adding_leaves;
            emp.leave_adjusted = parseInt(emp.leave_adjusted) || 0;
            emp.leave_next = emp.leave_available - emp.leave_adjusted;
        }

        function loadData() {
            const totalDays = getDaysInMonth(currentMonth);
            
            allData = employees.map(emp => {
                const data = { ...emp, attendance: {} };
                
                // Initialize attendance
                for (let d = 1; d <= totalDays; d++) {
                    const date = new Date(currentMonth + `-${String(d).padStart(2, '0')}`);
                    data.attendance[d] = date.getDay() === 0 ? 'WO' : 'P';
                }
                
                // Initialize editable fields
                data.ot_days = 0;
                data.holidays = 0;
                data.halfday = 0;
                data.leave_adjusted = 0;
                data.salary_done = 'No';
                data.remarks = '';
                
                calculateAllFields(data, totalDays);
                return data;
            });

            renderTable();
            updateStats();
        }

        function renderTable() {
            const totalDays = getDaysInMonth(currentMonth);
            const monthNames = { '2026-04': 'April', '2026-05': 'May', '2026-06': 'June' };
            
            // Build header
            let headerHTML = '<tr>';
            headerHTML += '<th class="sticky">Sr</th>';
            headerHTML += '<th class="sticky">Name</th>';
            headerHTML += '<th class="sticky">Branch</th>';
            headerHTML += '<th class="sticky">Gross Salary</th>';
            
            // Date columns with day names
            for (let d = 1; d <= totalDays; d++) {
                const date = new Date(currentMonth + `-${String(d).padStart(2, '0')}`);
                const dayName = getDayName(date);
                headerHTML += `<th class="date-col">${dayName}<br>${d}</th>`;
            }
            
            // Rest of columns
            const colHeaders = ['Month Days', 'Present', 'W/O', 'OT', 'Per Day', 'Holidays', 'Absent', 'Half Day', 'Tot Half', 'Act Pres', 'Act Abs', 'Tot Days', 
                'Lvng Pend', 'Add Lvng', 'Lvng Avl', 'Adj Lvng', 'Lvng Nxt', 'Paid Days', 'Ded Days', 'Monthly Sal', 'OT Sal', 'Tot Earn', 
                'PF', 'ESIC', 'P.TAX', 'Inc Tax', 'Advance', 'Loan', 'Tot Ded', 'Net Sal', 'Salary Done', 'Sal Date', 'Through', 'Remarks'];
            
            colHeaders.forEach(col => {
                headerHTML += `<th>${col}</th>`;
            });
            headerHTML += '</tr>';
            
            document.getElementById('tableHead').innerHTML = headerHTML;

            // Build rows
            let rowsHTML = '';
            allData.forEach((emp, idx) => {
                let cells = `<td class="sticky">${emp.sr_no}</td>`;
                cells += `<td class="sticky"><strong>${emp.name}</strong></td>`;
                cells += `<td class="sticky">${emp.branch}</td>`;
                cells += `<td class="sticky">₹${emp.gross_salary}</td>`;
                
                // Attendance dates
                for (let d = 1; d <= totalDays; d++) {
                    const val = emp.attendance[d] || 'P';
                    cells += `<td class="att-${val} date-cell"><input type="text" value="${val}" maxlength="2" onclick="cycleAtt(this, ${idx}, ${d})" data-emp="${idx}" data-day="${d}"></td>`;
                }
                
                // Summary columns
                cells += `<td class="calc summary-cell">${emp.month_days}</td>`;
                cells += `<td class="calc summary-cell">${emp.present_days}</td>`;
                cells += `<td class="calc summary-cell">${emp.weekly_off}</td>`;
                cells += `<td class="summary-cell"><input type="number" value="${emp.ot_days}" onchange="updateEmp(${idx}, 'ot_days', this.value)"></td>`;
                cells += `<td class="calc summary-cell">${emp.per_day_calc}</td>`;
                cells += `<td class="summary-cell"><input type="number" value="${emp.holidays}" onchange="updateEmp(${idx}, 'holidays', this.value)"></td>`;
                cells += `<td class="calc summary-cell">${emp.absent}</td>`;
                cells += `<td class="summary-cell"><input type="number" value="${emp.halfday}" onchange="updateEmp(${idx}, 'halfday', this.value)"></td>`;
                cells += `<td class="calc summary-cell">${emp.total_halfday}</td>`;
                cells += `<td class="calc summary-cell">${emp.actual_present}</td>`;
                cells += `<td class="calc summary-cell">${emp.actual_absent}</td>`;
                cells += `<td class="calc summary-cell">${emp.total_days}</td>`;
                cells += `<td class="calc summary-cell">${emp.leave_pending}</td>`;
                cells += `<td class="calc summary-cell">${emp.adding_leaves}</td>`;
                cells += `<td class="calc summary-cell">${emp.leave_available}</td>`;
                cells += `<td class="summary-cell"><input type="number" value="${emp.leave_adjusted}" onchange="updateEmp(${idx}, 'leave_adjusted', this.value)"></td>`;
                cells += `<td class="calc summary-cell">${emp.leave_next}</td>`;
                cells += `<td class="calc summary-cell">${emp.paid_days.toFixed(0)}</td>`;
                cells += `<td class="calc summary-cell">${emp.deduction_days.toFixed(0)}</td>`;
                cells += `<td class="calc summary-cell">₹${emp.monthly_salary}</td>`;
                cells += `<td class="calc summary-cell">₹${emp.ot_salary}</td>`;
                cells += `<td class="calc summary-cell">₹${emp.total_earned}</td>`;
                cells += `<td class="calc summary-cell">₹${emp.pf}</td>`;
                cells += `<td class="calc summary-cell">₹${emp.esic}</td>`;
                cells += `<td class="calc summary-cell">₹${emp.p_tax}</td>`;
                cells += `<td class="calc summary-cell">₹${emp.income_tax}</td>`;
                cells += `<td class="summary-cell"><input type="number" value="${emp.advance}" onchange="updateEmp(${idx}, 'advance', this.value)"></td>`;
                cells += `<td class="summary-cell"><input type="number" value="${emp.loan}" onchange="updateEmp(${idx}, 'loan', this.value)"></td>`;
                cells += `<td class="calc summary-cell">₹${emp.total_deduction}</td>`;
                cells += `<td class="calc summary-cell">₹${emp.net_salary}</td>`;
                cells += `<td class="summary-cell"><select onchange="updateEmp(${idx}, 'salary_done', this.value)"><option>No</option><option>Yes</option></select></td>`;
                cells += `<td class="summary-cell"><input type="date" onchange="updateEmp(${idx}, 'salary_date', this.value)"></td>`;
                cells += `<td class="summary-cell"><input type="text" placeholder="Cash/Check/Transfer" onchange="updateEmp(${idx}, 'through', this.value)"></td>`;
                cells += `<td class="summary-cell"><input type="text" placeholder="Remarks" onchange="updateEmp(${idx}, 'remarks', this.value)"></td>`;
                
                rowsHTML += `<tr>${cells}</tr>`;
            });
            
            document.getElementById('tableBody').innerHTML = rowsHTML;
        }

        function cycleAtt(cell, empIdx, day) {
            const statuses = ['P', 'A', 'H', 'WO'];
            const curr = cell.value.toUpperCase();
            const idx = statuses.indexOf(curr);
            const next = statuses[(idx + 1) % statuses.length];
            
            cell.value = next;
            cell.parentElement.className = 'att-' + next;
            
            allData[empIdx].attendance[day] = next;
            const totalDays = getDaysInMonth(currentMonth);
            calculateAllFields(allData[empIdx], totalDays);
            renderTable();
            updateStats();
            trackChange();
        }

        function updateEmp(idx, field, value) {
            allData[idx][field] = isNaN(value) ? value : parseFloat(value);
            const totalDays = getDaysInMonth(currentMonth);
            calculateAllFields(allData[idx], totalDays);
            renderTable();
            updateStats();
            trackChange();
        }

        function trackChange() { changes['tracked'] = true; }

        function filterTable() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const branch = document.getElementById('branchFilter').value;
            document.querySelectorAll('#tableBody tr').forEach(row => {
                const match = (!search || row.cells[1].textContent.toLowerCase().includes(search)) && 
                              (!branch || row.cells[2].textContent === branch);
                row.style.display = match ? '' : 'none';
            });
        }

        function updateStats() {
            const totalPresent = allData.reduce((s, e) => s + e.present_days, 0);
            const totalNetSalary = allData.reduce((s, e) => s + e.net_salary, 0);
            const totalDeduction = allData.reduce((s, e) => s + e.total_deduction, 0);
            document.getElementById('statsBar').innerHTML = `
                <div class="stat"><div class="stat-label">✅ Total Present</div><div class="stat-value">${totalPresent}</div></div>
                <div class="stat"><div class="stat-label">💰 Net Salary</div><div class="stat-value">₹${(totalNetSalary/100000).toFixed(2)}L</div></div>
                <div class="stat"><div class="stat-label">📊 Deductions</div><div class="stat-value">₹${(totalDeduction/100000).toFixed(2)}L</div></div>
                <div class="stat"><div class="stat-label">🏦 Avg/Employee</div><div class="stat-value">₹${Math.round(totalNetSalary/23)/1000}K</div></div>
            `;
        }

        function saveChanges() {
            if (Object.keys(changes).length === 0) {
                showMessage('ℹ️ No changes');
                return;
            }
            showMessage('✅ Payroll saved successfully!');
            changes = {};
        }

        function exportToExcel() {
            const ws = XLSX.utils.table_to_sheet(document.getElementById('dataTable'));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Payroll');
            const monthNames = { '2026-04': 'APR', '2026-05': 'MAY', '2026-06': 'JUN' };
            XLSX.writeFile(wb, `Payroll-${monthNames[currentMonth]}-2026.xlsx`);
            showMessage('✅ Exported!');
        }

        function changeMonth() {
            const newMonth = document.getElementById('monthSelect').value;
            if (newMonth !== currentMonth) {
                currentMonth = newMonth;
                loadData();
            }
        }

        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('branchFilter').value = '';
            filterTable();
        }

        function showMessage(msg) {
            const box = document.getElementById('messageBox');
            box.innerHTML = `<div class="message">${msg}</div>`;
            setTimeout(() => { box.innerHTML = ''; }, 2500);
        }
    </script>
</body>
</html>
