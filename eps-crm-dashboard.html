<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS CRM - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #8E2A8C 0%, #5c1b5a 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .box { background: white; padding: 50px; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 450px; border-top: 4px solid #D4AF37; }
        h1 { color: #8E2A8C; text-align: center; margin-bottom: 30px; font-size: 2em; }
        .group { margin-bottom: 20px; }
        label { display: block; color: #555; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; }
        input:focus { outline: none; border-color: #8E2A8C; }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 44px; }
        .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1em; padding: 4px; margin: 0; width: auto; }
        button.submit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #8E2A8C 0%, #6b1f69 100%); color: white; border: none; border-radius: 8px; font-size: 1em; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button.submit-btn:hover { filter: brightness(1.08); }
        .forgot-link { display: block; text-align: center; margin-top: 14px; color: #8E2A8C; font-size: 0.85em; text-decoration: none; cursor: pointer; }
        .forgot-link:hover { text-decoration: underline; }
        .msg { padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .error { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
        .success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .loading { display: none; text-align: center; color: #8E2A8C; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0; }
        .spinner { width: 38px; height: 38px; border-radius: 50%; border: 4px solid #e9d5e8; border-top-color: #8E2A8C; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 600px) { .box { padding: 30px 20px; } h1 { font-size: 1.5em; } }
    </style>
</head>
<body>
    <div class="box">
        <h1>📞 EPS CRM</h1>
        
        <div id="msg" class="msg" style="display:none;"></div>
        
        <div id="form">
            <div class="group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="your@email.com" autocomplete="username" aria-label="Email address">
            </div>
            <div class="group">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" aria-label="Password">
                    <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Show password" id="togglePasswordBtn">👁️</button>
                </div>
            </div>
            <button class="submit-btn" onclick="login()" aria-label="Log in">Login</button>
            <a class="forgot-link" onclick="forgotPassword()" role="button" tabindex="0" aria-label="Reset your password">Forgot password?</a>
        </div>

        <div class="loading" id="loading">
            <div class="spinner" role="status" aria-label="Signing in"></div>
            <div>Authenticating…</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rbxxvlrmcvrqentmctfb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_h65WSAQnbio1n_nlmHZNKQ_U27itQKz';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ROUTES = {
            'telecaller': 'eps-crm-complete-system.html',
            'admin': 'eps-crm-admin.html',
            'field_exec': 'eps-crm-fieldexec.html',
            'orders': 'eps-crm-orders.html',
            'collections': 'eps-crm-collections.html',
            'accounts': 'eps-crm-salary-attendance.html'
        };

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showMsg('Enter email and password', 'error');
                return;
            }

            document.getElementById('form').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Check if email is accounts@epsworldwide.in - route to Salary Dashboard
                if (email.toLowerCase() === 'accounts@epsworldwide.in') {
                    localStorage.setItem('eps_crm_user', JSON.stringify(data.user));
                    localStorage.setItem('eps_crm_user_email', email.toLowerCase());
                    localStorage.setItem('eps_crm_user_role', 'accounts');
                    showMsg('Login successful! Redirecting to Salary Dashboard...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = ROUTES['accounts'];
                    }, 1000);
                    return;
                }

                const { data: profile } = await supabase
                    .from('user_profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();

                const role = profile?.role || 'telecaller';
                localStorage.setItem('eps_crm_user', JSON.stringify(data.user));
                localStorage.setItem('eps_crm_user_role', role);

                showMsg('Login successful! Redirecting...', 'success');
                
                setTimeout(() => {
                    const page = ROUTES[role] || ROUTES['telecaller'];
                    window.location.href = page;
                }, 1000);

            } catch (err) {
                document.getElementById('form').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
                showMsg('Invalid email or password', 'error');
                console.error(err);
            }
        }

        function showMsg(text, type) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = 'msg ' + type;
            msg.style.display = 'block';
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const btn = document.getElementById('togglePasswordBtn');
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            btn.textContent = showing ? '👁️' : '🙈';
            btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        }

        async function forgotPassword() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMsg('Enter your email above first, then click "Forgot password?"', 'error');
                return;
            }
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email);
                if (error) throw error;
                showMsg('Password reset email sent to ' + email + '. Check your inbox.', 'success');
            } catch (err) {
                showMsg('Could not send reset email: ' + err.message, 'error');
            }
        }

        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
