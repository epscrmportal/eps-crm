<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS CRM - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .box { background: white; padding: 50px; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 450px; }
        h1 { color: #667eea; text-align: center; margin-bottom: 30px; font-size: 2em; }
        .group { margin-bottom: 20px; }
        label { display: block; color: #555; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; }
        input:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 1em; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #5568d3; }
        .msg { padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .error { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
        .success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .loading { display: none; text-align: center; color: #667eea; }
        @media (max-width: 600px) { .box { padding: 30px 20px; } h1 { font-size: 1.5em; } }
    </style>
</head>
<body>
    <div class="box">
        <h1>📞 EPS CRM</h1>
        
        <div id="msg" class="msg" style="display:none;"></div>
        
        <div id="form">
            <div class="group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button onclick="login()">Login</button>
        </div>
        
        <div class="loading" id="loading">Authenticating...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rbxxvlrmcvrqentmctfb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_h65WSAQnbio1n_nlmHZNKQ_U27itQKz';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ROUTES = {
            'telecaller': 'eps-crm-complete-system.html',
            'admin': 'eps-crm-admin.html',
            'field_exec': 'eps-crm-fieldexec.html',
            'orders': 'eps-crm-orders.html',
            'collections': 'eps-crm-collections.html',
            'accounts': 'eps-crm-salary-attendance.html'
        };

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showMsg('Enter email and password', 'error');
                return;
            }

            document.getElementById('form').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Check if email is accounts@epsworldwide.in - route to Salary Dashboard
                if (email.toLowerCase() === 'accounts@epsworldwide.in') {
                    localStorage.setItem('eps_crm_user', JSON.stringify(data.user));
                    localStorage.setItem('eps_crm_user_email', email.toLowerCase());
                    localStorage.setItem('eps_crm_user_role', 'accounts');
                    showMsg('Login successful! Redirecting to Salary Dashboard...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = ROUTES['accounts'];
                    }, 1000);
                    return;
                }

                const { data: profile } = await supabase
                    .from('user_profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();

                const role = profile?.role || 'telecaller';
                localStorage.setItem('eps_crm_user', JSON.stringify(data.user));
                localStorage.setItem('eps_crm_user_role', role);

                showMsg('Login successful! Redirecting...', 'success');
                
                setTimeout(() => {
                    const page = ROUTES[role] || ROUTES['telecaller'];
                    window.location.href = page;
                }, 1000);

            } catch (err) {
                document.getElementById('form').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
                showMsg('Invalid email or password', 'error');
                console.error(err);
            }
        }

        function showMsg(text, type) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = 'msg ' + type;
            msg.style.display = 'block';
        }

        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
