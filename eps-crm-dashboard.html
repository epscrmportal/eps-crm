<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPS CRM - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-container { background: white; padding: 50px; border-radius: 15px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; }
        .logo { text-align: center; margin-bottom: 40px; }
        .logo h1 { color: #667eea; font-size: 2.5em; margin-bottom: 5px; }
        .logo p { color: #999; font-size: 0.9em; }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; color: #555; margin-bottom: 10px; font-weight: 600; font-size: 0.95em; }
        .form-group input { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; transition: 0.3s; }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 10px rgba(102, 126, 234, 0.2); }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95em; }
        .alert-error { background: #fee2e2; color: #7f1d1d; border: 1px solid #fca5a5; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .alert-info { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
        .loading { display: none; text-align: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 600px) { .login-container { padding: 30px 20px; } .logo h1 { font-size: 2em; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>📞 EPS CRM</h1>
            <p>Lead Management System</p>
        </div>

        <div id="alertContainer"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>🔐 Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Login</button>
        </form>

        <div class="loading" id="loadingDiv">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #667eea; font-weight: bold;">Authenticating...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rbxxvlrmcvrqentmctfb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_h65WSAQnbio1n_nlmHZNKQ_U27itQKz';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const MODULE_ROUTES = {
            'telecaller': 'eps-crm-complete-system.html',
            'admin': 'eps-crm-admin.html',
            'field_exec': 'eps-crm-fieldexec.html',
            'orders': 'eps-crm-orders.html',
            'collections': 'eps-crm-collections.html'
        };

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!email || !password) {
                showAlert('Email and password required', 'error');
                return;
            }

            try {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('loadingDiv').style.display = 'block';

                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                const { data: profile, error: profileError } = await supabase
                    .from('user_profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();

                if (profileError) throw new Error('User profile not found');

                const userRole = profile?.role || 'telecaller';
                
                localStorage.setItem('eps_crm_user', JSON.stringify(data.user));
                localStorage.setItem('eps_crm_user_role', userRole);

                showAlert('✅ Welcome!', 'success');

                setTimeout(() => {
                    const targetModule = MODULE_ROUTES[userRole] || MODULE_ROUTES['telecaller'];
                    window.location.href = targetModule;
                }, 1500);

            } catch (error) {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('loadingDiv').style.display = 'none';
                showAlert('❌ Invalid email or password', 'error');
                console.error('Login error:', error);
            }
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = 'alert alert-' + type;
            alert.textContent = message;
            container.appendChild(alert);
            
            if (type !== 'error') {
                setTimeout(() => alert.remove(), 4000);
            }
        }

        window.addEventListener('load', async () => {
            try {
                const { data } = await supabase.auth.getSession();
                if (data.session) {
                    const { data: profile } = await supabase
                        .from('user_profiles')
                        .select('role')
                        .eq('id', data.session.user.id)
                        .single();

                    const userRole = profile?.role || 'telecaller';
                    const targetModule = MODULE_ROUTES[userRole] || MODULE_ROUTES['telecaller'];
                    window.location.href = targetModule;
                }
            } catch (error) {
                console.log('No active session');
            }
        });

        document.getElementById('loginPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
